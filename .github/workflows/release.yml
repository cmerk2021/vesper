name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo-sources.json
        run: |
          curl -fsSL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 -m pip install --break-system-packages aiohttp toml 'tomlkit>=0.13.3,<1.0'
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: vesper.flatpak
          manifest-path: packaging/io.github.cmerk2021.Vesper.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vesper.flatpak
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
