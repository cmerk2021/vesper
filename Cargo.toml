[workspace]
members = ["vesper-core", "vesper-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/cmerk2021/vesper"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
toml = "0.8"
directories = "6.0"
async-channel = "2.3"
