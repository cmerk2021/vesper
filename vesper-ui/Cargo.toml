[package]
name = "vesper-ui"
description = "Vesper: a native, beautiful Discord client for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vesper"
path = "src/main.rs"

[dependencies]
vesper-core = { path = "../vesper-core" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
toml.workspace = true
directories.workspace = true
async-channel.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
webkit6 = "0.6"
javascriptcore = { package = "javascriptcore6", version = "0.6" }
soup = { package = "soup3", version = "0.9" }
notify = "8.2"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
