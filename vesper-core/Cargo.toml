[package]
name = "vesper-core"
description = "Discord protocol, session, and theme logic for Vesper (no GTK dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
toml.workspace = true
directories.workspace = true
async-channel.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2.0"
rand = "0.9"
base64 = "0.22"
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
